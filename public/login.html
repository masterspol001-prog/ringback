<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RingBack — Sign in</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1220'/%3E%3Cpath d='M28 26h12l6 14-8 6a38 38 0 0016 16l6-8 14 6v12a8 8 0 01-9 8A58 58 0 0120 35a8 8 0 018-9z' fill='%232ee6a8'/%3E%3C/svg%3E" />
<style>
:root{--bg:#080d16;--card:#111c2e;--line:#1e2d45;--text:#e8eef7;--muted:#93a4bd;--accent:#2ee6a8;--accent2:#38bdf8;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 60% -10%,#12243d 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:6px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04121a;font-weight:900}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
input{width:100%;background:#0b1524;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
button{width:100%;margin-top:18px;border:none;border-radius:11px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--accent),#22c9a0);color:#04121a}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:14px;color:var(--red);font-size:13.5px;display:none}
.hint{margin-top:16px;color:var(--muted);font-size:12.5px;line-height:1.5}
a{color:var(--accent2);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">R</span> RingBack</div>
   <p class="sub">Sign in to see estimated vs verified revenue and the lead CRM.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus />
    <div style="height:14px"></div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <p class="hint">
    No account yet? Set <b>RB_ADMIN_EMAIL</b> and <b>RB_ADMIN_PASSWORD</b> in your environment and restart.
    <br /><br />Back to <a href="/">the site</a>.
  </p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const next = new URLSearchParams(location.search).get("next") || "/dashboard";

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn");
  btn.disabled = true;
  btn.textContent = "Signing in...";
  $("err").style.display = "none";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value, password: $("password").value }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "failed");
    location.href = next.startsWith("/") ? next : "/dashboard";
  } catch (err) {
    $("err").textContent = "Invalid email or password.";
    $("err").style.display = "block";
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
